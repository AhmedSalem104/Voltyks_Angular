<div class="login-container">
  <button class="theme-toggle" (click)="toggleTheme()" [title]="(currentTheme === 'dark' ? 'التبديل للوضع الفاتح' : 'التبديل للوضع الداكن')">
    <span class="material-icons">{{ currentTheme === 'dark' ? 'light_mode' : 'dark_mode' }}</span>
  </button>

  <div class="login-card">
    <!-- Logo Section -->
    <div class="login-header">
      <div class="logo">
        <img src="assets/images/Voltyks_Logo.jpg" alt="Voltyks Logo" />
      </div>
      <h1 class="login-title">نسيت كلمة المرور</h1>
      <p class="login-subtitle">أدخل بريدك الإلكتروني أو رقم هاتفك</p>
    </div>

    <!-- Success Message -->
    <div class="success-alert" *ngIf="successMessage">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
      </svg>
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div class="error-alert" *ngIf="errorMessage">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
      </svg>
      {{ errorMessage }}
    </div>

    <!-- Forget Password Form -->
    <form [formGroup]="forgetPasswordForm" (ngSubmit)="onSubmit()" class="login-form">

      <!-- Email or Phone Field -->
      <div class="form-group">
        <label for="emailOrPhone" class="form-label">
          البريد الإلكتروني أو رقم الهاتف
          <span class="required">*</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
          </svg>
          <input
            type="text"
            id="emailOrPhone"
            formControlName="emailOrPhone"
            class="form-input"
            [class.error]="isFieldInvalid('emailOrPhone')"
            placeholder="أدخل البريد الإلكتروني أو رقم الهاتف"
            autocomplete="username"
          />
        </div>
        <span class="error-message" *ngIf="isFieldInvalid('emailOrPhone')">
          {{ getErrorMessage('emailOrPhone') }}
        </span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="submit-btn"
        [disabled]="isLoading"
        [class.loading]="isLoading"
      >
        <span *ngIf="!isLoading">إرسال كود التحقق</span>
        <span *ngIf="isLoading" class="loading-spinner">
          <svg class="spinner" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" stroke-dashoffset="10"/>
          </svg>
          جاري الإرسال...
        </span>
      </button>

      <!-- Back to Login -->
      <div class="back-to-login">
        <a routerLink="/login" class="back-link">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
          </svg>
          العودة لتسجيل الدخول
        </a>
      </div>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p class="footer-text">
        جميع الحقوق محفوظة &copy; {{ currentYear }} Voltyks
      </p>
    </div>
  </div>
</div>
