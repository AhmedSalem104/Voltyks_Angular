<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Voltyks Admin Panel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/jpeg" href="assets/images/Voltyks_Logo.jpg">
  <link rel="apple-touch-icon" href="assets/images/Voltyks_Logo.jpg">

  <!-- Apply saved language/theme before Angular boots to avoid a flash -->
  <script>
    (function () {
      try {
        var lang = localStorage.getItem('voltyks-language') || 'ar';
        if (lang !== 'ar' && lang !== 'en') lang = 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        var theme = localStorage.getItem('voltyks-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        // Hand the chosen language to the preload <link> below
        var i18nPreload = document.getElementById('i18n-preload');
        if (i18nPreload) i18nPreload.href = '/assets/i18n/' + lang + '.json';
      } catch (e) { /* localStorage blocked — fall back to defaults */ }
    })();
  </script>

  <!-- Preconnect + early translation JSON preload (race-free with bootstrap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="i18n-preload" rel="preload" as="fetch" crossorigin="anonymous" href="/assets/i18n/ar.json">

  <!-- Cairo: only the two weights actually rendered -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols Rounded: subset to ranges actually used in the UI -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=swap" rel="stylesheet">

  <style>
    /* Pre-Angular splash so the user sees something within ~50ms */
    html, body { background: #0a0a0a; }
    html[data-theme='light'], html[data-theme='light'] body { background: #f7f9fb; }
    #app-splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      background: #0a0a0a;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    html[data-theme='light'] #app-splash { background: #f7f9fb; }
    #app-splash img {
      width: 64px; height: 64px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 200, 83, 0.28), 0 0 0 2px rgba(0, 200, 83, 0.12);
    }
    #app-splash .splash-spinner {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(0, 200, 83, 0.15);
      border-top-color: #00C853;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    #app-splash.is-hidden { opacity: 0; pointer-events: none; }
    /* Once Angular has rendered, the splash fades out and is removed by main.ts */
  </style>
</head>
<body class="voltyks-dark-theme">
  <div id="app-splash" aria-hidden="true">
    <img src="assets/images/Voltyks_Logo.jpg" alt="" />
    <div class="splash-spinner"></div>
  </div>
  <app-root></app-root>
</body>
</html>
